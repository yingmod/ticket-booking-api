name: CI/CD Pipeline - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Unit Test & Docker Package
    runs-on: ubuntu-latest

    # Khởi động sẵn Service Redis & RabbitMQ ảo trên máy chủ GitHub Actions để phục vụ test tự động
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Mã Nguồn từ GitHub
        uses: actions/checkout@v4

      - name: 2. Thiết lập Môi trường Java 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 3. Cấp quyền thực thi cho Maven Wrapper
        run: chmod +x mvnw

      - name: 4. Chạy Toàn Bộ Kiểm Thử Tự Động (Unit Tests)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: ./mvnw clean test

      - name: 5. Đóng Gói Docker Image Multi-Stage
        run: |
          docker build -t yingmod/ticket-booking-api:latest .
          echo "✅ Docker Image đã được build thành công!"
