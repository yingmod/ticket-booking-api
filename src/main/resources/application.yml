server:
  port: 8080

spring:
  application:
    name: ticket-booking-api

  datasource:
    url: jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Cấu hình Redis kết nối
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  # Cấu hình RabbitMQ Broker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 1

# Cấu hình JWT bí mật
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

# Cấu hình tham số Flash Sale & Ticket Booking
ticket:
  lock:
    wait-time-seconds: 3    # Thời gian tối đa chờ lấy khóa Redis (giây)
    lease-time-seconds: 5   # Thời gian giữ khóa tự động nhả nếu xảy ra crash (giây)
  reservation:
    hold-duration-minutes: 10 # Thời gian giữ chỗ vé chờ thanh toán (phút)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
